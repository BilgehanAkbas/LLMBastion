{% extends "layout.html" %}

{% block title %}Login - LLMBastion{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-6">
        <div class="card">
            <div class="card-header">LLMBastion Login</div>
            <div class="card-body">
                <form id="loginForm">
                    <div class="form-group">
                        <label>Username</label>
                        <input
                            type="text"
                            class="form-control"
                            name="username"
                            autocomplete="username"
                            required
                        >
                    </div>
                    <div class="form-group">
                        <label>Password</label>
                        <input
                            type="password"
                            class="form-control"
                            name="password"
                            autocomplete="current-password"
                            required
                        >
                    </div>
                    <button type="submit" class="btn btn-primary">Login</button>
                </form>
            </div>
            <div class="card-footer">
                <a href="/auth/register-page">Create an account</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
