{% extends "layout.html" %}

{% block title %}Edit Todo - LLMBastion{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card">
            <div class="card-header">Edit Todo</div>
            <div class="card-body">
                <form id="editTodoForm">
                    <div class="form-group">
                        <label>Title</label>
                        <input
                            type="text"
                            class="form-control"
                            name="title"
                            value="{{ todo.title }}"
                            minlength="3"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label>Description</label>
                        <textarea
                            class="form-control"
                            name="description"
                            rows="6"
                            minlength="3"
                            maxlength="1000"
                            required
                        >{{ todo.description }}</textarea>
                    </div>

                    <div class="form-group">
                        <label>Priority</label>
                        <select class="form-control" name="priority" required>
                            {% for p in range(1, 6) %}
                            <option value="{{ p }}" {% if todo.priority == p %}selected{% endif %}>
                                {{ p }}
                            </option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="form-check mb-3">
                        <input
                            type="checkbox"
                            class="form-check-input"
                            id="complete"
                            name="complete"
                            {% if todo.complete %}checked{% endif %}
                        >
                        <label class="form-check-label" for="complete">
                            Complete
                        </label>
                    </div>

                    <button type="submit" class="btn btn-primary">
                        Save
                    </button>
                    <button
                        type="button"
                        id="deleteButton"
                        class="btn btn-danger"
                    >
                        Delete
                    </button>
                    <a href="/todo/todo-page" class="btn btn-secondary">
                        Cancel
                    </a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
