{% extends "layout.html" %}

{% block title %}Register - LLMBastion{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card">
            <div class="card-header">Create LLMBastion account</div>
            <div class="card-body">
                <form id="registerForm">
                    <div class="form-row">
                        <div class="form-group col-md-6">
                            <label>Email</label>
                            <input
                                type="email"
                                class="form-control"
                                name="email"
                                autocomplete="email"
                                required
                            >
                        </div>
                        <div class="form-group col-md-6">
                            <label>Username</label>
                            <input
                                type="text"
                                class="form-control"
                                name="username"
                                autocomplete="username"
                                required
                            >
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group col-md-6">
                            <label>First Name</label>
                            <input
                                type="text"
                                class="form-control"
                                name="firstname"
                                required
                            >
                        </div>
                        <div class="form-group col-md-6">
                            <label>Last Name</label>
                            <input
                                type="text"
                                class="form-control"
                                name="lastname"
                                required
                            >
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Phone Number</label>
                        <input
                            type="text"
                            class="form-control"
                            name="phone_number"
                            autocomplete="tel"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label>Password</label>
                        <input
                            type="password"
                            class="form-control"
                            name="password"
                            autocomplete="new-password"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label>Verify Password</label>
                        <input
                            type="password"
                            class="form-control"
                            name="password2"
                            autocomplete="new-password"
                            required
                        >
                    </div>

                    <button type="submit" class="btn btn-primary">
                        Register
                    </button>
                </form>
            </div>
            <div class="card-footer">
                <a href="/auth/login-page">Already have an account?</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
